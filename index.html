
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="./manifest.json">
  <!-- skoop-live-runtime -->
  <script src="./skoop-live.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column; /* Changed to column to stack text and clock */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #10181f;
            font-family: sans-serif;
            font-size: 3em;
            text-align: center;
            border: 2px solid #00b7af; /* Added border */
            padding: 20px; /* Added padding */
            box-sizing: border-box; /* Include padding and border in the element's total width and height */
        }
        #clock {
            font-size: 0.5em; /* Smaller font size for clock */
            margin-top: 20px; /* Space between Hello World and clock */
        }
        .rainbow-text {
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
            background-clip: text;
            -webkit-background-clip: text; /* For Safari compatibility */
            color: transparent; /* Make the actual text color transparent so the background clip works */
            animation: rainbow-animation 5s linear infinite;
        }
        @keyframes rainbow-animation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body>
    <div class="rainbow-text">Hello World!</div>
    <div id="clock"></div>

  <script>
    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
    }

    setInterval(updateClock, 1000);
    updateClock(); // Initial call to display clock immediately
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js')
          .then(function (reg) { console.log('[PWA] SW registered:', reg.scope); })
          .catch(function (err) { console.warn('[PWA] SW registration failed:', err); });
      });
    }
  </script>
</body>
</html>
